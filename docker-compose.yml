services:
  wanderplaner:
    build: .
    container_name: wanderplaner
    ports:
      - "${WANDERPLANER_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

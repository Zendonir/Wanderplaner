name: Release

# Baut das Docker-Image, veröffentlicht es auf GHCR und legt ein
# GitHub-Release an. Auslösbar auf zwei Wegen:
#   - Push eines Versions-Tags (v1.0.0, v1.1.0, …)
#   - manuell über "Run workflow" mit Angabe der Version
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z. B. 1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/zendonir/wanderplaner

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version und Image-Tags bestimmen
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
          {
            echo "version=${VERSION}"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${MAJOR}.${MINOR}"
            echo "${IMAGE}:${MAJOR}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: QEMU einrichten (für arm64-Build)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Wanderplaner v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## 🥾 Wanderplaner v${{ steps.version.outputs.version }}

            Fertiges Docker-Image (amd64 + arm64):

            ```
            ghcr.io/zendonir/wanderplaner:${{ steps.version.outputs.version }}
            ```

            (alternativ `:latest` für die jeweils neueste Version)

            ### Installation auf TrueNAS SCALE

            1. **Apps → Discover Apps → Custom App** (bzw. **⋮ → Install via YAML**)
            2. Bei *Custom App*:
               - **Image Repository:** `ghcr.io/zendonir/wanderplaner`
               - **Image Tag:** `latest`
               - **Port:** Container-Port `80` → Host-Port z. B. `8080`
            3. Danach ist die App unter `http://<truenas-ip>:8080` erreichbar.

            Als YAML/Compose:

            ```yaml
            services:
              wanderplaner:
                image: ghcr.io/zendonir/wanderplaner:latest
                ports:
                  - "8080:80"
                restart: unless-stopped
            ```

            Details und weitere Optionen: siehe README.

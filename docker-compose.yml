services:
  wanderplaner:
    # Fertiges Image von GHCR; wer das Repo ausgecheckt hat, kann mit
    # `docker compose up -d --build` stattdessen lokal bauen.
    image: ghcr.io/zendonir/wanderplaner:latest
    build: .
    container_name: wanderplaner
    ports:
      - "${WANDERPLANER_PORT:-8080}:8080"
    volumes:
      # Stempelstellen, Parkplätze und Touren – geräteübergreifend.
      - wanderplaner-data:/data
      # Nur für "Jetzt aktualisieren" in der Oberfläche nötig – bewusst
      # auskommentiert. Wer den Socket freigibt, gibt der App faktisch
      # Rootrechte auf dem Host. Siehe README, Abschnitt "Aktualisieren".
      # - /var/run/docker.sock:/var/run/docker.sock
    # environment:
    #   ALLOW_SELF_UPDATE: "1"
    #   CONTAINER_NAME: wanderplaner
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  wanderplaner-data:
